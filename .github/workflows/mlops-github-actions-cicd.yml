
name: MLOps CI/CD - Iris Classifier

on:
  push:
    branches: ["main"]
    paths:
      - "mlops-github-actions-cicd/**"
      - ".github/workflows/mlops-github-actions-cicd.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "mlops-github-actions-cicd/**"
      - ".github/workflows/mlops-github-actions-cicd.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-train-and-package:
    name: Test, train, validate, and package
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mlops-github-actions-cicd

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            mlops-github-actions-cicd/requirements.txt
            mlops-github-actions-cicd/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint Python code
        run: ruff check src tests

      - name: Run unit tests
        run: python -m pytest -v

      - name: Train and validate model
        run: python -m src.train

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: iris-model
          path: mlops-github-actions-cicd/artifacts/iris_model.joblib
          if-no-files-found: error
          retention-days: 14
